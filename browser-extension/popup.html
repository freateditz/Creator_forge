<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorForge</title>
  <style>
    :root {
      --bg: #0C0C0E;
      --surface: #141416;
      --surface2: #1C1C1F;
      --border: #2A2A2F;
      --primary: #7B68EE;
      --primary-dim: #5B4ED6;
      --primary-surface: #1E1B3A;
      --text-high: #F4F4F6;
      --text-mid: #A1A1AA;
      --text-low: #71717A;
      --success: #22C55E;
      --warning: #F59E0B;
      --error: #EF4444;
      --info: #38BDF8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      max-height: 600px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text-high);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      width: 24px; height: 24px;
      background: var(--primary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-title { font-weight: 600; font-size: 13px; color: var(--text-high); }
    .header-page { font-size: 11px; color: var(--text-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Connection status ── */
    .status-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-low);
      flex-shrink: 0;
    }
    .status-dot[data-state="connected"] { background: var(--success); }
    .status-dot[data-state="connecting"] { background: var(--warning); animation: blink 1s infinite; }
    .status-dot[data-state="error"] { background: var(--error); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    #status-label { color: var(--text-mid); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .toolbar-title { flex: 1; font-size: 11px; font-weight: 500; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-icon {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px;
      color: var(--text-mid); cursor: pointer; font-size: 11px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-icon:hover { background: var(--surface2); color: var(--text-high); }
    .btn-icon:disabled { opacity: 0.4; cursor: default; }

    /* ── Media list ── */
    .media-list { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }

    /* ── Empty state ── */
    .empty-state {
      padding: 28px 20px;
      text-align: center;
      color: var(--text-low);
      font-size: 12px;
      line-height: 1.5;
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── Media card ── */
    .media-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .media-card-header { display: flex; align-items: flex-start; gap: 8px; }
    .media-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .media-info { flex: 1; min-width: 0; }
    .media-title { font-size: 12px; font-weight: 500; color: var(--text-high); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-meta { font-size: 11px; color: var(--text-mid); margin-top: 2px; }

    /* ── Format row ── */
    .format-row select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-high);
      font-size: 11px;
      padding: 5px 8px;
      outline: none;
    }

    /* ── Card actions ── */
    .card-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn {
      border-radius: 6px; padding: 5px 12px; font-size: 11px;
      font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--primary-dim); }
    .btn-outline {
      background: none; border: 1px solid var(--border);
      color: var(--text-mid);
    }
    .btn-outline:hover { background: var(--surface2); color: var(--text-high); }

    /* ── Status labels ── */
    .status-label { font-size: 11px; padding: 3px 8px; border-radius: 10px; }
    .status-drm { background: #2d1010; color: var(--error); }
    .status-info { background: #0f1e2d; color: var(--info); }
    .status-dim { color: var(--text-low); }
    .status-error { color: var(--error); font-size: 11px; }

    /* ── Footer ── */
    .footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: flex-end;
    }
    .footer a { font-size: 11px; color: var(--text-low); text-decoration: none; }
    .footer a:hover { color: var(--primary); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
      white-space: nowrap; pointer-events: none;
      animation: fadein 0.2s ease;
    }
    .toast-success { background: #0f2d1a; color: var(--success); border: 1px solid rgba(34,197,94,.3); }
    .toast-error { background: #2d1010; color: var(--error); border: 1px solid rgba(239,68,68,.3); }
    @keyframes fadein { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">⚡</div>
    <div class="header-info">
      <div class="header-title" id="page-title">—</div>
      <div class="header-page" id="page-domain"></div>
    </div>
  </div>

  <!-- Connection status -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-label">Connecting…</span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <span class="toolbar-title">Detected Media</span>
    <button class="btn-icon" id="refresh-btn" title="Re-scan page">↻ Refresh</button>
    <button class="btn-icon" id="clear-btn" disabled title="Clear list">✕ Clear</button>
  </div>

  <!-- Media list -->
  <div class="media-list" id="media-list"></div>

  <!-- Empty state -->
  <div class="empty-state" id="empty-state" hidden>
    <div class="empty-icon">📭</div>
    <div>No media detected on this page.</div>
    <div style="margin-top:4px">Try clicking Refresh, or play a video first.</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" id="setup-link">Setup help</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
