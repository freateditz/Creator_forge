name: CI – Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Tool setup (all three runtimes up-front so failures surface early) ──────
      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor (Windows)
        run: flutter doctor -v

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      # ── Flutter checks ────────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # ── Flutter Windows release build ─────────────────────────────────────────
      - name: Windows release build
        run: flutter build windows --release

      - name: Verify Flutter build output
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$releaseDir\creator_forge.exe")) {
            Write-Error "creator_forge.exe not found in $releaseDir"
            exit 1
          }
          if (-not (Test-Path "$releaseDir\flutter_windows.dll")) {
            Write-Error "flutter_windows.dll not found in $releaseDir"
            exit 1
          }
          if (-not (Test-Path "$releaseDir\data\flutter_assets")) {
            Write-Error "flutter_assets directory not found"
            exit 1
          }
          Write-Host "Flutter build output verified."
          Get-ChildItem "$releaseDir" | Select-Object Name, Length

      # ── Browser extension ─────────────────────────────────────────────────────
      # Must run before the installer so dist/ exists when iscc reads it.
      - name: Extension – install deps
        working-directory: browser-extension
        run: npm ci

      - name: Extension – build
        working-directory: browser-extension
        run: npm run build

      - name: Extension – validate manifest
        working-directory: browser-extension
        run: npm run validate-manifest

      - name: Extension – tests
        working-directory: browser-extension
        run: npm test

      # ── Native messaging host (PyInstaller) ───────────────────────────────────
      - name: Native host – install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Native host – build exe
        working-directory: native-host
        shell: pwsh
        run: |
          pyinstaller build_windows.spec --noconfirm --distpath dist
          if (-not (Test-Path "dist\creator_forge_native_host.exe")) {
            Write-Error "PyInstaller did not produce creator_forge_native_host.exe"
            exit 1
          }
          $size = (Get-Item "dist\creator_forge_native_host.exe").Length
          Write-Host "Native host exe: $([math]::Round($size/1MB, 1)) MB"

      - name: Native host – unit tests
        run: python native-host\test_native_host.py

      - name: Native host – e2e tests
        run: python native-host\test_e2e.py

      # Copy native-host exe into the Flutter release dir so iscc can find it.
      - name: Copy native-host exe into release tree
        shell: pwsh
        run: |
          $nhDest = "build\windows\x64\runner\Release\NativeHost"
          New-Item -ItemType Directory -Force -Path $nhDest | Out-Null
          Copy-Item "native-host\dist\creator_forge_native_host.exe" $nhDest -Force
          Write-Host "Copied native host exe to $nhDest"

      # ── Validate all installer inputs before invoking iscc ────────────────────
      - name: Validate installer inputs
        shell: pwsh
        run: |
          $errors = @()

          # Flutter release build
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$releaseDir\creator_forge.exe")) {
            $errors += "MISSING: $releaseDir\creator_forge.exe"
          }
          if (-not (Test-Path "$releaseDir\NativeHost\creator_forge_native_host.exe")) {
            $errors += "MISSING: $releaseDir\NativeHost\creator_forge_native_host.exe"
          }

          # Browser extension dist/
          $extDist = "browser-extension\dist"
          if (-not (Test-Path $extDist -PathType Container)) {
            $errors += "MISSING directory: $extDist"
          } else {
            if (-not (Test-Path (Join-Path $extDist "manifest.json") -PathType Leaf)) {
              $errors += "MISSING: $extDist\manifest.json"
            }
            $extFiles = Get-ChildItem $extDist -Recurse -File
            if (-not $extFiles) {
              $errors += "EMPTY: $extDist — extension build produced no files"
            } else {
              Write-Host "Browser extension files verified: $($extFiles.Count) files"
              $extFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          }

          # Native host Python script
          if (-not (Test-Path "native-host\creator_forge_host.py")) {
            $errors += "MISSING: native-host\creator_forge_host.py"
          }

          # Installer scripts
          foreach ($script in @("install_native_host.ps1", "uninstall_native_host.ps1")) {
            $p = "installer\windows\scripts\$script"
            if (-not (Test-Path $p)) {
              $errors += "MISSING: $p"
            }
          }

          if ($errors.Count -gt 0) {
            Write-Error ("Installer input validation failed:`n" + ($errors -join "`n"))
            exit 1
          }

          Write-Host "All installer inputs verified."

      # ── Upload Flutter release artifact (before installer so it's available
      #    even if iscc fails) ──────────────────────────────────────────────────
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator_forge_windows_release
          path: build\windows\x64\runner\Release\
          retention-days: 7

      # ── Inno Setup installer ──────────────────────────────────────────────────
      - name: Detect or install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path `
            ([Environment]::GetFolderPath('ProgramFilesX86')) `
            'Inno Setup 6\ISCC.exe'

          if (-not (Test-Path -LiteralPath $iscc)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Inno Setup."
            }
            $iscc = Join-Path `
              ([Environment]::GetFolderPath('ProgramFilesX86')) `
              'Inno Setup 6\ISCC.exe'
          }

          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found after Inno Setup detection/installation."
          }

          "ISCC_PATH=$iscc" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" installer\windows\creator_forge.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $installer = "installer\windows\Output\CreatorForge-1.0.0-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            Write-Error "Installer not produced at expected path: $installer"
            exit 1
          }
          $size = (Get-Item $installer).Length
          Write-Host "Installer produced: $installer ($([math]::Round($size / 1MB, 1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorForge-1.0.0-Setup
          path: installer\windows\Output\CreatorForge-1.0.0-Setup.exe
          retention-days: 7
