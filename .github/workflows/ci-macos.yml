name: CI – macOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: macOS debug build
        run: flutter build macos --debug

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Extension – install deps
        working-directory: browser-extension
        run: npm ci

      - name: Extension – build
        working-directory: browser-extension
        run: npm run build

      - name: Extension – tests
        working-directory: browser-extension
        run: npm test

      - name: Extension – validate manifest
        working-directory: browser-extension
        run: npm run validate-manifest

      - name: Native host – unit tests
        run: python3 native-host/test_native_host.py

      - name: Native host – e2e tests
        run: python3 native-host/test_e2e.py
